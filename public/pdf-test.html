<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PDF.js Render Test v2</title>
  <style>
    body { font-family: monospace; background: #111; color: #0f0; padding: 20px; }
    #log { white-space: pre-wrap; margin: 10px 0; max-height: 500px; overflow-y: auto; background: #000; padding: 10px; border: 1px solid #333; font-size: 12px; }
    canvas { border: 2px solid #0ff; margin: 10px; display: block; }
    h2 { color: #0ff; }
    h3 { color: #fff; }
    .error { color: #f00; }
    .success { color: #0f0; }
    .info { color: #ff0; }
  </style>
</head>
<body>
  <h2>🔧 PDF.js Render Diagnostic v2 — Multiple Strategies</h2>
  <input type="file" id="pdfInput" accept=".pdf,application/pdf">
  <div id="log"></div>
  <div id="canvasContainer"></div>

  <script type="module">
    import * as pdfjsLib from '/node_modules/pdfjs-dist/build/pdf.mjs';

    const logEl = document.getElementById('log');
    const container = document.getElementById('canvasContainer');

    function log(msg, cls = '') {
      const line = document.createElement('div');
      line.className = cls;
      line.textContent = `[${new Date().toISOString().slice(11,23)}] ${msg}`;
      logEl.appendChild(line);
      logEl.scrollTop = logEl.scrollHeight;
      console.log(msg);
    }

    function checkCanvas(canvas, label) {
      const ctx = canvas.getContext('2d');
      if (!ctx) { log(`${label}: getContext returned null`, 'error'); return false; }
      const sz = Math.min(100, canvas.width, canvas.height);
      const imgData = ctx.getImageData(0, 0, sz, sz);
      let nonWhite = 0;
      for (let j = 0; j < imgData.data.length; j += 4) {
        if (imgData.data[j] < 250 || imgData.data[j+1] < 250 || imgData.data[j+2] < 250) nonWhite++;
      }
      const ok = nonWhite > 0;
      log(`${label}: ${nonWhite} non-white pixels ${ok ? '✅' : '❌ BLANK'}`, ok ? 'success' : 'error');
      return ok;
    }

    pdfjsLib.GlobalWorkerOptions.workerSrc = '/node_modules/pdfjs-dist/build/pdf.worker.min.mjs';
    log(`pdfjs-dist version: ${pdfjsLib.version}`, 'info');

    document.getElementById('pdfInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      container.innerHTML = '';

      log(`\n========== Loading: ${file.name} ==========`);
      const arrayBuffer = await file.arrayBuffer();

      const pdf = await pdfjsLib.getDocument({
        data: new Uint8Array(arrayBuffer),
        cMapUrl: '/cmaps/',
        cMapPacked: true,
        standardFontDataUrl: '/standard_fonts/',
      }).promise;

      log(`PDF loaded, ${pdf.numPages} pages`, 'success');

      const page = await pdf.getPage(1);
      const vp = page.getViewport({ scale: 1.5 });
      log(`Page 1 viewport: ${vp.width.toFixed(0)}x${vp.height.toFixed(0)}`);
      const W = Math.floor(vp.width);
      const H = Math.floor(vp.height);

      // =====================================================
      // STRATEGY A: canvas directly (v6 preferred)
      // =====================================================
      log('\n--- Strategy A: { canvas, viewport } ---', 'info');
      {
        const c = document.createElement('canvas');
        c.width = W; c.height = H;
        try {
          await page.render({ canvas: c, viewport: vp }).promise;
          log('A: render resolved', 'success');
        } catch(e) { log('A: render FAILED: ' + e.message, 'error'); }
        checkCanvas(c, 'A');
        addCanvas(c, 'Strategy A: canvas param');
      }

      // Need a fresh page proxy for each render (pdfjs caches render state)
      const page2 = await pdf.getPage(1);

      // =====================================================
      // STRATEGY B: canvasContext + canvas:null
      // =====================================================
      log('\n--- Strategy B: { canvasContext, canvas: null, viewport } ---', 'info');
      {
        const c = document.createElement('canvas');
        c.width = W; c.height = H;
        const ctx = c.getContext('2d', { alpha: false, willReadFrequently: true });
        try {
          await page2.render({ canvasContext: ctx, canvas: null, viewport: vp }).promise;
          log('B: render resolved', 'success');
        } catch(e) { log('B: render FAILED: ' + e.message, 'error'); }
        checkCanvas(c, 'B');
        addCanvas(c, 'Strategy B: canvasContext + canvas:null');
      }

      const page3 = await pdf.getPage(1);

      // =====================================================
      // STRATEGY C: canvasContext only (omit canvas entirely)
      // =====================================================
      log('\n--- Strategy C: { canvasContext, viewport } (omit canvas) ---', 'info');
      {
        const c = document.createElement('canvas');
        c.width = W; c.height = H;
        const ctx = c.getContext('2d');
        try {
          // Omit canvas property entirely - let default kick in
          await page3.render({ canvasContext: ctx, viewport: vp }).promise;
          log('C: render resolved', 'success');
        } catch(e) { log('C: render FAILED: ' + e.message, 'error'); }
        checkCanvas(c, 'C');
        addCanvas(c, 'Strategy C: canvasContext only');
      }

      const page4 = await pdf.getPage(1);

      // =====================================================
      // STRATEGY D: canvas + intent:print (forces sync rendering)
      // =====================================================
      log('\n--- Strategy D: { canvas, viewport, intent: "print" } ---', 'info');
      {
        const c = document.createElement('canvas');
        c.width = W; c.height = H;
        try {
          await page4.render({ canvas: c, viewport: vp, intent: 'print' }).promise;
          log('D: render resolved', 'success');
        } catch(e) { log('D: render FAILED: ' + e.message, 'error'); }
        checkCanvas(c, 'D');
        addCanvas(c, 'Strategy D: canvas + intent:print');
      }

      const page5 = await pdf.getPage(1);

      // =====================================================
      // STRATEGY E: canvas + delayed check (test if rAF delayed)
      // =====================================================
      log('\n--- Strategy E: canvas + 2s delay check ---', 'info');
      {
        const c = document.createElement('canvas');
        c.width = W; c.height = H;
        try {
          await page5.render({ canvas: c, viewport: vp }).promise;
          log('E: render resolved, waiting 2s...', 'success');
        } catch(e) { log('E: render FAILED: ' + e.message, 'error'); }
        addCanvas(c, 'Strategy E: delayed check');
        // Wait 2 seconds then recheck
        await new Promise(r => setTimeout(r, 2000));
        checkCanvas(c, 'E after 2s delay');
      }

      log('\n========== ALL STRATEGIES COMPLETE ==========', 'info');

      function addCanvas(canvas, title) {
        const h = document.createElement('h3');
        h.textContent = title;
        const clone = document.createElement('canvas');
        clone.width = canvas.width;
        clone.height = canvas.height;
        clone.style.maxWidth = '400px';
        clone.style.height = 'auto';
        const ctx = clone.getContext('2d');
        ctx.drawImage(canvas, 0, 0);
        container.appendChild(h);
        container.appendChild(clone);
      }
    });
  </script>
</body>
</html>
